
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(15px) brightness(0.5);
    transform: scale(1.05);
    transition: 1.2s ease;
}

#overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    cursor: pointer;
    transition: 1s ease;
}

#enter {
    color: white;
    font-size: 25px;
    letter-spacing: 5px;
    transition: 0.3s;
}

#enter:hover {
    opacity: 0.5;
    letter-spacing: 9px;
}

body.active #video {
    filter: blur(0) brightness(1);
    transform: scale(1);
}

body.active #overlay {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<video id="video" loop playsinline>
    <source src="https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/video.mp4" type="video/mp4">
</video>

<div id="overlay" onclick="enterSite()">
    <span id="enter">Enter</span>
</div>

<script>
function enterSite() {
    document.body.classList.add("active");

    const video = document.getElementById("video");
    video.play();
}
</script>

</body>
</html>
