
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    object-fit: cover;
    filter: blur(15px) brightness(.5);
    transform: scale(1.05);
    transition: 1.2s ease;
}

#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
}

#overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    cursor: pointer;
    padding: 20px;
    transition: opacity 1s;
}

#enter {
    color: white;
    font-size: clamp(20px, 5vw, 25px);
    letter-spacing: clamp(3px, 1vw, 5px);
    transition: .3s;
    user-select: none;
}

@media (hover: hover) {
    #enter:hover {
        opacity: .5;
        letter-spacing: 9px;
    }
}

#navbar {
    position: fixed;
    top: max(25px, env(safe-area-inset-top));
    left: max(25px, env(safe-area-inset-left));
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    z-index: 4;
    opacity: 0;
    transform: translateY(-10px);
    transition: .8s ease;
    pointer-events: none;
}

.nav-button {
    background: rgba(0,0,0,.35);
    color: white;
    border: 1px solid rgba(255,255,255,.2);
    padding: 11px 19px;
    min-height: 40px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 5px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: .3s;
    white-space: nowrap;
}

@media (hover: hover) {
    .nav-button:hover {
        background: white;
        color: black;
        border-color: white;
        transform: translateY(-2px);
    }
}

body.active #video {
    filter: blur(0) brightness(1);
    transform: scale(1);
}

body.active #overlay {
    opacity: 0;
    pointer-events: none;
}

body.active #navbar {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

body.active #snow {
    opacity: 1;
}

/* Mobile */
@media (max-width: 600px) {
    #navbar {
        top: max(15px, env(safe-area-inset-top));
        left: 50%;
        transform: translate(-50%, -10px);
        width: calc(100% - 30px);
        justify-content: center;
        gap: 8px;
    }

    body.active #navbar {
        transform: translate(-50%, 0);
    }

    .nav-button {
        flex: 1;
        min-width: 0;
        padding: 12px 8px;
        min-height: 44px;
        font-size: 11px;
        letter-spacing: .5px;
    }

    #enter {
        font-size: 23px;
        letter-spacing: 4px;
    }
}

/* Very small screens */
@media (max-width: 350px) {
    #navbar {
        gap: 5px;
        width: calc(100% - 20px);
    }

    .nav-button {
        padding: 10px 5px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<video id="video" loop playsinline webkit-playsinline preload="auto">
    <source src="https://raw.githubusercontent.com/ergtergetgretet/matagal2/main/lol.mp4" type="video/mp4">
</video>

<canvas id="snow"></canvas>

<div id="navbar">
   <button class="nav-button" onclick="window.open('https://pornhub.com', '_blank')">Try Now</button>
 <button class="nav-button" onclick="window.open('https://discord.com/invite/QEkBfcaJXc', '_blank')">Discord</button>
    <button class="nav-button" onclick="window.open('', '_blank')">Configs</button>
</div>

<div id="overlay" onclick="enterSite()">
    <span id="enter">Enter</span>
</div>

<script>

async function enterSite() {
    const video = document.getElementById("video");

    try {
        await video.play();
        document.body.classList.add("active");
        startSnow();
    } catch (e) {
        console.error("Video error:", e);
    }
}

// Snow effect
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];
let snowRunning = false;
let animationId;

function resizeSnow() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (snowRunning) {
        flakes.forEach(f => {
            f.x = Math.random() * window.innerWidth;
            f.y = Math.random() * window.innerHeight;
        });
    }
}

window.addEventListener("resize", resizeSnow);
window.addEventListener("orientationchange", resizeSnow);

resizeSnow();

function startSnow() {
    if (snowRunning) return;

    snowRunning = true;

    const mobile = window.innerWidth <= 600;
    const amount = mobile ? 65 : 150;

    flakes = Array.from({length: amount}, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + .5,
        drift: Math.random() * 1 - .5,
        opacity: Math.random() * .7 + .3
    }));

    animateSnow();
}

function animateSnow() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    flakes.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
        ctx.fill();

        f.y += f.speed;
        f.x += f.drift;

        if (f.y > window.innerHeight) {
            f.y = -5;
            f.x = Math.random() * window.innerWidth;
        }

        if (f.x > window.innerWidth) f.x = 0;
        if (f.x < 0) f.x = window.innerWidth;
    });

    animationId = requestAnimationFrame(animateSnow);
}
</script>

</body>
</html>
