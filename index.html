
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    filter: blur(15px) brightness(0.5);
    transform: scale(1.05);
    transition: 1.2s ease;
}

#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
}

#overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    cursor: pointer;
    transition: opacity 1s;
}

#enter {
    color: white;
    font-size: 25px;
    letter-spacing: 5px;
    transition: 0.3s;
}

#enter:hover {
    opacity: 0.5;
    letter-spacing: 9px;
}

#navbar {
    position: fixed;
    top: 25px;
    left: 25px;
    display: flex;
    gap: 10px;
    z-index: 4;
    opacity: 0;
    transform: translateY(-10px);
    transition: 0.8s ease;
    pointer-events: none;
}

.nav-button {
    background: rgba(0,0,0,0.35);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 11px 19px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 5px;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.nav-button:hover {
    background: white;
    color: black;
    border-color: white;
    transform: translateY(-2px);
}

body.active #video {
    filter: blur(0) brightness(1);
    transform: scale(1);
}

body.active #overlay {
    opacity: 0;
    pointer-events: none;
}

body.active #navbar {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

body.active #snow {
    opacity: 1;
}
</style>
</head>

<body>

<video id="video" loop playsinline preload="auto">
    <source src="https://raw.githubusercontent.com/ergtergetgretet/matagal2/main/lol.mp4" type="video/mp4">
</video>

<canvas id="snow"></canvas>

<div id="navbar">
    <button class="nav-button" onclick="openDiscord()">Try Now</button>
    <button class="nav-button" onclick="openDiscord()">Discord</button>
    <button class="nav-button" onclick="openDiscord()">Configs</button>
</div>

<div id="overlay" onclick="enterSite()">
    <span id="enter">Enter</span>
</div>

<script>
const discord = "https://discord.gg/QEkBfcaJXc";

function openDiscord() {
    window.open(discord, "_blank");
}

async function enterSite() {
    const video = document.getElementById("video");

    try {
        await video.play();
        document.body.classList.add("active");
        startSnow();
    } catch (e) {
        console.error("Video error:", e);
    }
}

// Snow effect
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];
let snowRunning = false;

function resizeSnow() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeSnow);
resizeSnow();

function startSnow() {
    if (snowRunning) return;
    snowRunning = true;

    flakes = Array.from({length: 150}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + 0.5,
        drift: Math.random() * 1 - 0.5,
        opacity: Math.random() * 0.7 + 0.3
    }));

    animateSnow();
}

function animateSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    flakes.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
        ctx.fill();

        f.y += f.speed;
        f.x += f.drift;

        if (f.y > canvas.height) {
            f.y = -5;
            f.x = Math.random() * canvas.width;
        }

        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
    });

    requestAnimationFrame(animateSnow);
}
</script>

</body>
</html>
